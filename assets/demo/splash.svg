<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 520" width="100%" height="100%">
  <defs>
    <linearGradient id="splash-bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A1A1A"/>
      <stop offset="100%" stop-color="#0B0B0B"/>
    </linearGradient>
    <linearGradient id="title-gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF5D9"/>
      <stop offset="100%" stop-color="#F6C667"/>
    </linearGradient>
    <filter id="gold-glow-large" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Base Frame -->
  <rect width="400" height="520" rx="16" fill="url(#splash-bg-grad)" stroke="rgba(246,198,103,0.35)" stroke-width="1.5"/>

  <!-- Subtle Ambient Glow -->
  <circle cx="200" cy="230" r="90" fill="#F6C667" opacity="0.08" filter="url(#gold-glow-large)"/>

  <!-- Centered Mascot (Excited Boot State) -->
  <g transform="translate(160, 150)" filter="url(#gold-glow-large)">
    <polygon points="40,6 74,26 74,66 40,86 6,66 6,26" fill="#8E1616" stroke="#F6C667" stroke-width="2.5"/>
    <!-- Excited Eyes (Wink & Sparkle) -->
    <path d="M 24 38 Q 30 32 36 38" fill="none" stroke="#FEF5D9" stroke-width="3" stroke-linecap="round"/>
    <ellipse cx="54" cy="38" rx="4" ry="6" fill="#FEF5D9"/>
    <!-- Happy Smile -->
    <path d="M 32 54 Q 40 62 48 54" fill="none" stroke="#FEF5D9" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- Title & Tagline -->
  <text x="200" y="285" font-family="system-ui, sans-serif" font-size="32" font-weight="900" fill="url(#title-gold-grad)" text-anchor="middle" letter-spacing="-0.03em" filter="url(#gold-glow-large)">Bundle</text>
  <text x="200" y="315" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="rgba(254,245,217,0.7)" text-anchor="middle" letter-spacing="0.04em">ONE CLICK OPENS YOUR WORKFLOW</text>

  <!-- CRT TV Scanline & Collapse Effect Decorative Overlay -->
  <line x1="40" y1="360" x2="360" y2="360" stroke="rgba(246,198,103,0.15)" stroke-width="1"/>
  <line x1="80" y1="365" x2="320" y2="365" stroke="rgba(246,198,103,0.3)" stroke-width="1.5"/>
  <circle cx="200" cy="365" r="3" fill="#F6C667"/>

  <!-- Footer Tag -->
  <text x="200" y="475" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#F6C667" text-anchor="middle" letter-spacing="0.1em">RETRO CRT BOOT SEQUENCER</text>
</svg>
