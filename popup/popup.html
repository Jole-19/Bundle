<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=400, initial-scale=1.0">
  <title>Bundle</title>
  <link rel="stylesheet" href="popup.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
  <!-- Intro Splash Overlay -->
  <div id="intro-splash" class="intro-splash-overlay">
    <div class="splash-glow"></div>
    <div class="splash-content">
      <div class="splash-mascot-wrap" id="splash-mascot-wrap">
        <object id="splash-mascot-svg" type="image/svg+xml"
                data="../assets/mascot/animations/idle.svg"
                width="110" height="110"
                aria-label="Splash Mascot"></object>
      </div>
      <h1 id="splash-title" class="splash-title">Bundle</h1>
    </div>
  </div>

  <div id="app">
    <!-- Header -->
    <header id="header">
      <div class="header-stripe"></div>
      <div class="header-left">
        <div class="header-brand">
          <h1 class="header-title">Bundle</h1>
        </div>
      </div>
      <div class="header-actions">
        <button id="btn-popout" class="btn-icon" title="Open in standalone window">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><use href="#icon-external"></use></svg>
        </button>
        <button id="btn-add" class="btn-icon btn-add-main" title="New collection">
          <svg width="14" height="14" viewBox="0 0 16 16" fill="none"><path d="M8 2v12M2 8h12" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
        </button>
      </div>
    </header>

    <!-- Mascot area -->
    <div id="mascot-container">
      <div id="mascot-glow"></div>
      <object id="mascot-svg" type="image/svg+xml"
              data="../assets/mascot/animations/idle.svg"
              width="180" height="180"
              aria-label="Bundle mascot"></object>
      <p id="mascot-label">Ready to go!</p>
    </div>

    <!-- Collections list -->
    <div id="collections-area">
      <div id="collections-list"></div>
      <!-- Empty state -->
      <div id="empty-state" style="display:none">
        <p class="empty-title">No collections yet</p>
        <p class="empty-sub">Create one to get started!</p>
        <button id="btn-empty-add" class="btn-primary">
          <svg width="14" height="14" viewBox="0 0 16 16" fill="none"><path d="M8 2v12M2 8h12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          New Collection
        </button>
      </div>
    </div>

    <!-- New / Edit collection form (hidden by default) -->
    <div id="form-overlay" class="overlay" style="display:none">
      <div class="form-card">
        <div class="form-header">
          <h2 id="form-title">New Collection</h2>
          <div class="form-mascot-wrap">
            <object id="form-mascot-svg" type="image/svg+xml"
                    data="../assets/mascot/animations/idle.svg"
                    width="44" height="44"
                    aria-label="Modal mascot mini"></object>
          </div>
        </div>
        <label class="form-label">
          Name
          <input id="input-name" type="text" placeholder="e.g. Design Research" maxlength="40" autocomplete="off" />
        </label>
        <div class="form-label">
          <div class="icon-header-row" id="toggle-icon-picker">
            <div class="icon-header-left">
              <span>Icon</span>
              <div id="icon-selected-preview" class="icon-selected-badge" title="Current icon">
                <svg id="selected-icon-svg" viewBox="0 0 24 24"><use href="#icon-package"></use></svg>
              </div>
            </div>
            <button type="button" class="btn-toggle-icons" id="btn-toggle-icons">
              <span id="toggle-icon-text">More Icons</span>
              <svg class="chevron-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
            </button>
          </div>
          <div id="icon-picker" class="icon-picker-grid collapsed"></div>
          <input type="hidden" id="input-icon" value="package" />
        </div>
        <div class="form-label">
          <div class="url-header">
            <div class="url-title-wrap">
              <span>URLs / Searches</span>
              <span class="form-hint">(one per line)</span>
            </div>
            <div class="url-helpers">
              <button type="button" id="btn-add-select-tabs" class="btn-quick-tag" title="Select specific open tabs to add">
                + Select Tabs
              </button>
              <button type="button" id="btn-add-all-tabs" class="btn-quick-tag" title="Add all open browser tabs in window">
                + All Tabs
              </button>
            </div>
          </div>
          <textarea id="input-urls" rows="4" placeholder="https://pinterest.com&#10;shadcn ui components&#10;https://dribbble.com"></textarea>
        </div>
        <div class="form-actions">
          <button id="btn-cancel" class="btn-secondary">Cancel</button>
          <button id="btn-save" class="btn-primary">Save</button>
        </div>
      </div>
    </div>

    <!-- Tab Picker Modal Overlay -->
    <div id="tab-picker-overlay" class="overlay" style="display:none; z-index: 110;">
      <div class="form-card tab-picker-card">
        <div class="form-header">
          <h2>Select Open Tabs</h2>
          <button type="button" id="btn-toggle-select-all" class="btn-deselect-pill">Deselect All</button>
        </div>
        <div id="tab-picker-list" class="tab-picker-list">
          <!-- Dynamically populated tab items -->
        </div>
        <div class="form-actions tab-picker-actions">
          <button type="button" id="btn-tab-picker-cancel" class="btn-cancel-gold">Cancel</button>
          <button type="button" id="btn-tab-picker-confirm" class="btn-add-selected">+ Add Selected</button>
        </div>
      </div>
    </div>

    <!-- Delete Confirmation Modal Overlay -->
    <div id="delete-confirm-overlay" class="overlay" style="display:none; z-index: 120;">
      <div class="delete-confirm-card">
        <div class="delete-mascot-wrap">
          <object id="delete-mascot-svg" type="image/svg+xml"
                  data="../assets/mascot/animations/sad.svg"
                  width="70" height="70"
                  aria-label="Sad Mascot"></object>
        </div>
        <h2 class="delete-modal-title">Delete Collection?</h2>
        <p class="delete-modal-desc">Are you sure you want to delete <strong id="delete-target-name">"Collection"</strong>? This action cannot be undone.</p>
        <div class="form-actions delete-actions">
          <button type="button" id="btn-delete-cancel" class="btn-cancel-gold">Cancel</button>
          <button type="button" id="btn-delete-confirm" class="btn-delete-danger">Delete</button>
        </div>
      </div>
    </div>
  </div>
  </div>

  <!-- SVG Sprite sheet -->
  <div id="svg-sprite-container" style="display:none"></div>

  <script src="../lib/state-machine.js"></script>
  <script src="popup.js"></script>
</body>
</html>
